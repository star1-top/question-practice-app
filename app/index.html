<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>题目练习器 · 题库版</title>
<link rel="stylesheet" href="assets/style.css?v=20261023-fix2">
<link rel="stylesheet" href="assets/design.css?v=20261029-taste2">
<!-- 依赖全部本地化：不走公共 CDN，避免网络波动导致云端登录 / PDF 解析不可用 -->
<script src="assets/vendor/wb-cloud-sdk.js"></script>
<script src="assets/vendor/pdf.min.js"></script>
<script src="assets/vendor/mammoth.browser.min.js"></script>
</head>
<body>

<header class="app-header" id="appSidebar">
  <div class="hd">
    <div class="logo"><svg class="brand-mark" viewBox="0 0 28 30" fill="none" aria-hidden="true"><path d="M3 3h9c3 0 5 2 5 5v19c-2-2-4-3-7-3H3V3Z" stroke="currentColor" stroke-width="1.6"/><path d="M17 7h8v20h-8M7 9h6M7 13h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="m9 18 2 2 4-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>题目练习器<span class="pro">题库版</span></div>
    <button class="menu-toggle" id="menuToggle" aria-label="打开导航" aria-expanded="false" aria-controls="navTabs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <label class="workspace-label" for="bankSelect">当前学习</label>
    <select id="bankSelect" class="bank-select" aria-label="切换题库"></select>

  </div>
  <nav class="tabs" id="navTabs">
    <div class="nav-section-label">学习工具</div>
    <button data-tab="market" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="13" y="3" width="6" height="6" rx="1"/><rect x="3" y="13" width="6" height="6" rx="1"/><rect x="13" y="13" width="6" height="6" rx="1"/></svg>题库广场</button>
    <button data-tab="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 4 5 5M4 18l1-5L15 3l5 5L10 18l-6 1Z"/></svg>练习</button>
    <button data-tab="exam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="14" height="16" rx="2"/><path d="M8 2v4h6V2M8 10h6M8 14h6"/></svg>模拟考试</button>
    <button data-tab="recite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5c-3-2-6-2-9-1v14c3-1 6-1 9 1m0-14c3-2 6-2 9-1v14c-3-1-6-1-9 1V5Z"/></svg>背题</button>
    <button data-tab="wrong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11v17H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z M3 16h14M9 7l5 5M14 7l-5 5"/></svg>错题本</button>
    <button data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2-3 8H3l7 4-2 7 5-6 6 3-3-7 4-5-7 1-1-5Z"/></svg>知识点</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v17h17M7 15v-4M12 15V6M17 15V9"/></svg>统计</button>
    <div class="nav-section-label nav-section-secondary">个人空间</div>
    <button data-tab="banks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h5v16H3zM8 4h5v16H8zM14 5l4-1 4 15-5 1-3-15Z"/></svg>我的题库</button>
    <button data-tab="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="7" r="4"/><path d="M3 21v-3a8 8 0 0 1 16 0v3"/></svg>我的</button>
  </nav>
  <div class="sidebar-note"><span>把每一题，学得更明白。</span>练习 · 复盘 · 再进步</div>
    <div class="hd-right">
      <button id="creditBtn" class="credit-pill" title="AI 次数余额">
        <span class="bolt">AI</span><b id="creditNum">--</b><span class="unit">次</span>
      </button>
      <button id="themeBtn" class="icon-btn" title="切换深色/浅色" aria-label="切换深色或浅色模式">◐</button>
      <button id="userBtn" class="user-btn">登录</button>
    </div>
</header>

<main id="main">
  <div class="workspace-bar"><div class="workspace-path"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 8 10 2l8 6v9H2V8Z M7 17v-6h6v6"/></svg><span>学习空间</span><span>/</span><b id="currentPage">题库广场</b></div><span class="workspace-meta"><i class="local-dot"></i>题库 · 练习 · 复习</span></div>
  <section id="view-market" class="view"><div class="page-heading"><h1>题库广场</h1><p>正在读取课程目录…</p></div></section>
  <section id="view-practice" class="view hide"></section>
  <section id="view-exam" class="view hide"></section>
  <section id="view-recite" class="view hide"></section>
  <section id="view-wrong" class="view hide"></section>
  <section id="view-notes" class="view hide"></section>
  <section id="view-stats" class="view hide"></section>
  <section id="view-banks" class="view hide"></section>
  <section id="view-account" class="view hide"></section>
  <div class="footer">
    <span id="footStat">共 0 道题</span> · 未登录时数据只存在本机浏览器
  </div>
</main>

<div id="overlay" class="overlay hide" role="dialog" aria-modal="true"></div>
<div id="toastBox" class="toast-box" role="status" aria-live="polite"></div>

<script src="assets/config.js?v=20261023-fix2"></script>
<script src="assets/previews.js?v=20261029-previews5"></script>
<script src="assets/cloud.js?v=20261028-report1"></script>
<script src="assets/parse.js?v=20261023-fix2"></script>
<script src="assets/ai.js?v=20261028-report1"></script>
<script src="assets/app.js?v=20261029-taste2"></script>
<script src="assets/design-ui.js?v=20261023-fix2"></script>
</body>
</html>
